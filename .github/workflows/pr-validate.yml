name: PR — Validate & Plan

on:
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"

permissions:
  contents: read
  pull-requests: write
  id-token: write  # required for OIDC authentication

jobs:
  validate:
    name: Terraform Validate & Plan
    runs-on: ubuntu-latest

    env:
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID:        ${{ secrets.AZURE_TENANT_ID }}
      ARM_CLIENT_ID:        ${{ secrets.AZURE_CLIENT_ID }}
      ARM_USE_OIDC:         "true"
      TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_ssh_public_key:  ${{ secrets.VM_SSH_PUBLIC_KEY }}
      ARM_ACCESS_KEY:         ${{ secrets.AZURE_TFSTATE_STORAGE_KEY }}

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC — no secrets stored)
        uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.x"

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        # Not continue-on-error — format failures block the PR

      - name: Checkov IaC Security Scan
        id: checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          output_format: cli
          soft_fail: true   # reports findings but does not block until baseline is established
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: terraform init -backend-config="key=azvmdeploy.dev.tfstate"

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        run: terraform plan -out=tfplan -no-color
        continue-on-error: true

      - name: Upload plan artifact
        if: steps.plan.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ github.event.pull_request.number }}
          path: terraform/tfplan
          retention-days: 5

      - name: Post Plan Summary to PR
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fmt      = '${{ steps.fmt.outcome }}';
            const checkov  = '${{ steps.checkov.outcome }}';
            const validate = '${{ steps.validate.outcome }}';
            const plan     = '${{ steps.plan.outcome }}';

            const icon = (s) => s === 'success' ? '✅' : s === 'skipped' ? '⏭' : '❌';

            const body = [
              '## Terraform Plan Results',
              '',
              `| Step | Status |`,
              `|------|--------|`,
              `| Format check       | ${icon(fmt)} \`${fmt}\` |`,
              `| Checkov IaC scan   | ${icon(checkov)} \`${checkov}\` |`,
              `| Validate           | ${icon(validate)} \`${validate}\` |`,
              `| Plan               | ${icon(plan)} \`${plan}\` |`,
              '',
              '<details><summary>Plan output</summary>',
              '',
              '```hcl',
              `${{ steps.plan.outputs.stdout }}`,
              '```',
              '</details>',
              '',
              plan === 'failure'
                ? '> ⚠️ Plan failed — review errors above before merging.'
                : checkov === 'failure'
                ? '> ⚠️ Checkov found security findings — review before merging. Plan artifact uploaded for deploy.'
                : '> ✅ All checks passed — safe to merge. Plan artifact uploaded for deploy.',
            ].join('\n');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              body,
            });

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1
