name: Deploy — Terraform Apply

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"

permissions:
  contents: read
  id-token: write  # required for OIDC authentication

jobs:
  deploy:
    name: Terraform Apply
    runs-on: ubuntu-latest
    environment: production  # requires manual approval in GitHub repo settings

    env:
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID:        ${{ secrets.AZURE_TENANT_ID }}
      ARM_CLIENT_ID:        ${{ secrets.AZURE_CLIENT_ID }}
      ARM_USE_OIDC:         "true"
      TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_ssh_public_key:  ${{ secrets.VM_SSH_PUBLIC_KEY }}
      ARM_ACCESS_KEY:         ${{ secrets.AZURE_TFSTATE_STORAGE_KEY }}

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC — no secrets stored)
        uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.x"

      - name: Terraform Init
        run: terraform init -backend-config="key=azvmdeploy.dev.tfstate"

      - name: Download plan artifact (from PR validation)
        id: download_plan
        uses: actions/download-artifact@v4
        with:
          # PR number is not available on push; fall back to fresh plan if artifact missing
          name: tfplan-${{ github.event.pull_request.number }}
          path: terraform/
        continue-on-error: true

      - name: Terraform Plan (fresh — if no PR artifact available)
        id: plan_fresh
        if: steps.download_plan.outcome == 'failure'
        run: terraform plan -out=tfplan -no-color

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      - name: Output deployment summary
        run: terraform output -no-color

      - name: Post-deployment validation
        run: |
          cd ${{ github.workspace }}
          ENVIRONMENT=$(terraform -chdir=terraform output -raw resource_group_name 2>/dev/null | sed 's/rg-azvmdeploy-//' || echo "dev")
          bash scripts/validate_deployment.sh "rg-azvmdeploy-${ENVIRONMENT}" "${ENVIRONMENT}"
